services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dhabar
      MYSQL_USER: dhabar
      MYSQL_PASSWORD: dhabar
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - dhabar-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    profiles: ["host"]
    build: .
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      PORT: 4000
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: dhabar
      MYSQL_PASSWORD: dhabar
      MYSQL_DATABASE: dhabar
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-only-change-me}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://resturent.sandipandas.website}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    profiles: ["host"]
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  dhabar-mysql:
